spring:
  application:
    name: image-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/image_processing}
    username: ${DB_USERNAME:image_app}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  storage:
    upload-directory: uploads

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      show-details: always

info:
  application:
    name: Image Processing API
    description: API responsible for accepting image processing jobs
    version: 0.1.0