apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-worker
  namespace: image-processing
  labels:
    app: image-worker

spec:
  replicas: 1

  selector:
    matchLabels:
      app: image-worker

  template:
    metadata:
      labels:
        app: image-worker

    spec:
      serviceAccountName: image-worker

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: image-worker
          image: europe-central2-docker.pkg.dev/gcp-image-pub-sub/image-processing-dev/image-worker:0.1.0
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          envFrom:
            - configMapRef:
                name: image-processing-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: image-processing-db
                  key: DB_PASSWORD

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: image-worker-tmp
              mountPath: /tmp

        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          imagePullPolicy: IfNotPresent

          args:
            - "--private-ip"
            - "--auto-iam-authn=false"
            - "--port=5432"
            - "gcp-image-pub-sub:europe-central2:image-processing-dev-postgres"

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          volumeMounts:
            - name: cloud-sql-proxy-tmp
              mountPath: /tmp

      volumes:
        - name: image-worker-tmp
          emptyDir: {}

        - name: cloud-sql-proxy-tmp
          emptyDir: {}