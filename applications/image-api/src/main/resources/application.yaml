spring:
  application:
    name: image-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/image_processing}
    username: ${DB_USERNAME:image_app}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  storage:
    upload-directory: ${UPLOAD_DIRECTORY:uploads}

  pubsub:
    project-id: ${PUBSUB_PROJECT_ID:local-image-project}
    topic-id: ${PUBSUB_TOPIC_ID:image-jobs}
    emulator-host: ${PUBSUB_EMULATOR_HOST:localhost:8085}

  outbox:
    polling-interval-ms: ${OUTBOX_POLLING_INTERVAL_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:10}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      show-details: always

info:
  application:
    name: Image Processing API
    description: API responsible for accepting image processing jobs
    version: 0.1.0

