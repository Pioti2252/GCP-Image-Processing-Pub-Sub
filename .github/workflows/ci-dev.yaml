name: CI DEV

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gcp-image-pub-sub
  PROJECT_NUMBER: "337402413508"
  REGION: europe-central2
  REPOSITORY: image-processing-dev

  API_IMAGE: image-api
  WORKER_IMAGE: image-worker

  GKE_CLUSTER: image-processing-dev-gke
  GKE_LOCATION: europe-central2
  K8S_NAMESPACE: image-processing

jobs:
  test:
    name: Test applications
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: image_processing
          POSTGRES_USER: image_app
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U image_app -d image_processing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test image-api
        working-directory: applications/image-api
        env:
          DB_URL: jdbc:postgresql://localhost:5432/image_processing
          DB_USERNAME: image_app
          DB_PASSWORD: test_password

          STORAGE_BUCKET_NAME: test-image-processing-bucket
          GCP_PROJECT_ID: gcp-image-pub-sub
          PUBSUB_TOPIC_ID: image-jobs-dev

          PUBSUB_EMULATOR_HOST: localhost:8085
        run: mvn clean test

      - name: Test image-worker
        working-directory: applications/image-worker
        env:
          DB_URL: jdbc:postgresql://localhost:5432/image_processing
          DB_USERNAME: image_app
          DB_PASSWORD: test_password

          STORAGE_BUCKET_NAME: test-image-processing-bucket
          GCP_PROJECT_ID: gcp-image-pub-sub
          PUBSUB_SUBSCRIPTION_ID: image-jobs-worker-dev

          APP_PUBSUB_SUBSCRIBER_ENABLED: "false"
        run: mvn clean test

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test

    # Pull request wykonuje wyłącznie testy.
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/337402413508/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-dev@gcp-image-pub-sub.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Prepare image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build image-api
        run: |
          docker build \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${API_IMAGE}:${IMAGE_TAG}" \
            applications/image-api

      - name: Build image-worker
        run: |
          docker build \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${WORKER_IMAGE}:${IMAGE_TAG}" \
            applications/image-worker

      - name: Push image-api
        run: |
          docker push \
            "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${API_IMAGE}:${IMAGE_TAG}"

      - name: Push image-worker
        run: |
          docker push \
            "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${WORKER_IMAGE}:${IMAGE_TAG}"
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs:
      - test
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    environment:
      name: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-dev@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}
          namespace: ${{ env.K8S_NAMESPACE }}

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes
          kubectl get pods -n "${K8S_NAMESPACE}"

      - name: Set image tags in DEV overlay
        working-directory: kubernetes/overlays/dev
        run: |
          sed -i -E "s#newTag: \".*\"#newTag: \"${GITHUB_SHA}\"#g" kustomization.yaml

          echo "Rendered images:"
          kubectl kustomize . | grep "image:"

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply \
            -k kubernetes/overlays/dev \
            --dry-run=server

      - name: Deploy to DEV
        run: |
          kubectl apply \
            -k kubernetes/overlays/dev

      - name: Wait for image-api rollout
        run: |
          kubectl rollout status \
            deployment/image-api \
            -n "${K8S_NAMESPACE}" \
            --timeout=5m

      - name: Wait for image-worker rollout
        run: |
          kubectl rollout status \
            deployment/image-worker \
            -n "${K8S_NAMESPACE}" \
            --timeout=5m

      - name: Show deployed resources
        if: always()
        run: |
          kubectl get pods \
            -n "${K8S_NAMESPACE}" \
            -o wide

          kubectl get deployments \
            -n "${K8S_NAMESPACE}"

          kubectl get events \
            -n "${K8S_NAMESPACE}" \
            --sort-by='.lastTimestamp' |
            tail -n 30