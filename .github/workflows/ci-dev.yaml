name: CI DEV

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gcp-image-pub-sub
  PROJECT_NUMBER: "337402413508"
  REGION: europe-central2
  REPOSITORY: image-processing-dev

  API_IMAGE: image-api
  WORKER_IMAGE: image-worker

  GKE_CLUSTER: image-processing-dev-gke
  GKE_LOCATION: europe-central2-a
  K8S_NAMESPACE: image-processing

jobs:
  test:
    name: Test applications
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: image_processing
          POSTGRES_USER: image_app
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U image_app -d image_processing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test image-api
        working-directory: applications/image-api
        env:
          DB_URL: jdbc:postgresql://localhost:5432/image_processing
          DB_USERNAME: image_app
          DB_PASSWORD: test_password

          STORAGE_BUCKET_NAME: test-image-processing-bucket
          GCP_PROJECT_ID: gcp-image-pub-sub
          PUBSUB_TOPIC_ID: image-jobs-dev

          PUBSUB_EMULATOR_HOST: localhost:8085
        run: mvn clean test

      - name: Test image-worker
        working-directory: applications/image-worker
        env:
          DB_URL: jdbc:postgresql://localhost:5432/image_processing
          DB_USERNAME: image_app
          DB_PASSWORD: test_password

          STORAGE_BUCKET_NAME: test-image-processing-bucket
          GCP_PROJECT_ID: gcp-image-pub-sub
          PUBSUB_SUBSCRIPTION_ID: image-jobs-worker-dev

          APP_PUBSUB_SUBSCRIBER_ENABLED: "false"
        run: mvn clean test

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test

    # Pull request wykonuje wyłącznie testy.
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/337402413508/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-dev@gcp-image-pub-sub.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Prepare image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build image-api
        run: |
          docker build \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${API_IMAGE}:${IMAGE_TAG}" \
            applications/image-api

      - name: Build image-worker
        run: |
          docker build \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${WORKER_IMAGE}:${IMAGE_TAG}" \
            applications/image-worker

      - name: Push image-api
        run: |
          docker push \
            "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${API_IMAGE}:${IMAGE_TAG}"

      - name: Push image-worker
        run: |
          docker push \
            "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${WORKER_IMAGE}:${IMAGE_TAG}"

  update-dev-manifest:
    name: Update DEV manifest
    runs-on: ubuntu-latest
    needs:
      - test
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update DEV image tags
        working-directory: kubernetes/overlays/dev
        run: |
          sed -i -E "s#newTag: \".*\"#newTag: \"${GITHUB_SHA}\"#g" kustomization.yaml

          echo "Updated DEV images:"
          kubectl kustomize . | grep "image:"

      - name: Commit DEV manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/overlays/dev/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi

          git commit -m "chore(dev): deploy ${GITHUB_SHA}"
          git push origin HEAD:main